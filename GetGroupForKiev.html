<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Номер групи — YASNO</title>

  <style>
    body { margin:0; padding:18px; font-family:-apple-system, Segoe UI, Roboto, Arial; background:#f6f7f9; }
    .box { max-width:560px; margin:0 auto; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow:0 10px 24px rgba(0,0,0,.08); border:1px solid rgba(0,0,0,.06); }
    h1 { font-size:18px; margin:0 0 12px; }
    label { display:block; font-size:13px; margin:12px 0 6px; color:#333; }

    input {
      width:100%; box-sizing:border-box;
      padding:12px; border-radius:12px;
      border:1px solid rgba(0,0,0,.18);
      font-size:15px;
    }

    button{
      margin-top:14px; width:100%;
      padding:12px 14px; border-radius:12px; border:0;
      cursor:pointer; font-size:15px; font-weight:700;
      background:#2AABEE; color:#fff;
      display:flex; align-items:center; justify-content:center; gap:10px;
    }

    button:disabled { opacity:.6; cursor:not-allowed; }

    .row { display:flex; gap:10px; margin-top:10px; }
    .row button { margin-top:0; width:auto; flex:1; background:#111; }
    .row button.secondary { background:#e9eef2; color:#111; }

    .msg { margin-top:14px; padding:12px; border-radius:12px; display:none; white-space:pre-wrap; }
    .ok  { background:rgba(46,204,113,.12); border:1px solid rgba(46,204,113,.35); color:#1f7a43; }
    .err { background:rgba(231,76,60,.10); border:1px solid rgba(231,76,60,.35); color:#8a1f16; }

    .spinner{
      width:18px; height:18px; border-radius:50%;
      border:2px solid rgba(255,255,255,.45);
      border-top-color:#fff;
      display:none;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === AUTOCOMPLETE === */
    .autocomplete { position:relative; }

    .dropdown {
      position:absolute;
      top:100%;
      left:0;
      right:0;
      z-index:50;
      background:#fff;
      border-radius:12px;
      margin-top:6px;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
      max-height:260px;
      overflow:auto;
    }

    .item {
      padding:10px 12px;
      cursor:pointer;
      font-size:14px;
    }
    .item:hover,
    .item.active {
      background:#f0f5ff;
    }

    .hint {
      font-size:12px;
      opacity:.75;
      margin-top:6px;
    }

    /* === WARMUP overlay === */
    .overlay{
      position:fixed; inset:0; z-index:9999;
      background:rgba(246,247,249,.92);
      display:flex; align-items:center; justify-content:center;
      padding:18px;
    }
    .overlay-card{
      max-width:520px; width:100%;
      background:#fff;
      border-radius:16px;
      padding:16px;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
      border:1px solid rgba(0,0,0,.06);
      display:flex; align-items:center; gap:12px;
    }
    .overlay-title{ font-weight:800; }
    .overlay-sub{ font-size:13px; opacity:.75; margin-top:2px; }
    .overlay .spinner{
      display:inline-block;
      width:22px; height:22px;
      border:2px solid rgba(42,171,238,.25);
      border-top-color:#2AABEE;
    }
    .overlay[hidden] { 
      display: none !important; 
    }

  </style>
</head>

<body>

<!-- WARMUP OVERLAY -->
<div id="warmupOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <span class="spinner" aria-hidden="true"></span>
    <div>
      <div class="overlay-title">Підключаємося до сервісу…</div>
      <div class="overlay-sub">Render може “прокидатися” 10–30 секунд. Зачекайте трішки.</div>
    </div>
  </div>
</div>

<div class="box">
  <div class="card">
    <h1>Отримання номера групи (Київ)</h1>

    <label>Вулиця</label>
    <div class="autocomplete" id="streetWrap">
      <input id="street" placeholder="Почніть вводити…" autocomplete="off" />
      <div id="streetDropdown" class="dropdown" hidden></div>
    </div>
    <input type="hidden" id="streetId" />

    <label>Будинок</label>
    <div class="autocomplete" id="houseWrap">
      <input id="house" placeholder="Напр.: 13 або 38/А" autocomplete="off" />
      <div id="houseDropdown" class="dropdown" hidden></div>
    </div>
    <input type="hidden" id="houseId" />
    <div class="hint" id="houseHint" style="display:none;">Спочатку оберіть вулицю зі списку.</div>

    <button id="btn">
      <span class="spinner" id="spin"></span>
      <span id="btnText">Отримати номер групи</span>
    </button>



    <div id="msgOk" class="msg ok"></div>
    <div id="msgErr" class="msg err"></div>
  </div>
</div>

<script>
const PROXY_BASE = "https://getnubergroupproxy.onrender.com";
const $ = id => document.getElementById(id);

let streetItems = [];
let streetActive = -1;
let streetTimer = null;

let houseItems = [];
let houseActive = -1;
let houseTimer = null;

/* ===== helpers ===== */

function showOk(t){$("msgOk").textContent=t;$("msgOk").style.display="block";$("msgErr").style.display="none";}
function showErr(t){$("msgErr").textContent=t;$("msgErr").style.display="block";$("msgOk").style.display="none";}
function setLoading(v){$("btn").disabled=v;$("spin").style.display=v?"inline-block":"none";$("btnText").textContent=v?"Зачекайте…":"Отримати номер групи";}

function showWarmup(on){ $("warmupOverlay").hidden = !on; }

function hideStreetDropdown(){ $("streetDropdown").hidden = true; }
function hideHouseDropdown(){ $("houseDropdown").hidden = true; }

function clearHouseSelection(){
  $("house").value = "";
  $("houseId").value = "";
  houseItems = [];
  houseActive = -1;
  hideHouseDropdown();
}

function setHouseHint(visible){
  $("houseHint").style.display = visible ? "block" : "none";
}

function getSelectedStreetId(){
  const v = ($("streetId").value || "").trim();
  const n = parseInt(v, 10);
  return Number.isFinite(n) && n > 0 ? n : null;
}

/* ===== Render warm-up (wake Render on page load) =====
   We call base endpoint that returns "OK" to wake the service.
   Show overlay spinner while waking.
*/
async function warmupRender(){
  showWarmup(true);

  // try a few times because first request can be slow / fail while waking up
  const url = `${PROXY_BASE}/`;
  const maxAttempts = 3;

  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 15000); // 15s per attempt
      const r = await fetch(url, { method:"GET", cache:"no-store", signal: ctrl.signal });
      clearTimeout(t);

      // ok if 200-399
      if(r.ok){
        showWarmup(false);
        return;
      }
    }catch(e){
      // ignore and retry
    }

    // small delay before retry
    await new Promise(res=>setTimeout(res, 800));
  }

  // even if warmup fails, we just hide overlay and allow user to continue
  showWarmup(false);
}
document.addEventListener("DOMContentLoaded", warmupRender);

/* ===== STREET autocomplete ===== */
/* search from 3 chars */
$("street").addEventListener("input", () => {
  const q = $("street").value.trim();

  $("streetId").value = "";
  clearHouseSelection();
  setHouseHint(true);

  clearTimeout(streetTimer);
  if (q.length < 3) {
    hideStreetDropdown();
    return;
  }
  streetTimer = setTimeout(() => loadStreets(q), 250);
});

async function loadStreets(q){
  try{
    const resp = await fetch(`${PROXY_BASE}/api/streets?q=${encodeURIComponent(q)}`, { cache:"no-store" });
    const list = await resp.json();
    streetItems = Array.isArray(list) ? list : [];
    renderStreetDropdown();
  }catch{
    hideStreetDropdown();
  }
}

function renderStreetDropdown(){
  const dd = $("streetDropdown");
  dd.innerHTML = "";
  streetActive = -1;

  if(!streetItems.length){
    hideStreetDropdown();
    return;
  }

  streetItems.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = s.name;
    div.onclick = () => selectStreet(i);
    dd.appendChild(div);
  });
  dd.hidden = false;
}

function selectStreet(i){
  const s = streetItems[i];
  $("street").value = s.name;
  $("streetId").value = s.id || "";
  hideStreetDropdown();

  setHouseHint(false);
  $("house").focus();
  triggerHouseSearch();
}

$("street").addEventListener("keydown", (e)=>{
  if ($("streetDropdown").hidden) return;

  if(e.key==="ArrowDown"){ e.preventDefault(); streetActive = Math.min(streetActive+1, streetItems.length-1); }
  if(e.key==="ArrowUp"){ e.preventDefault(); streetActive = Math.max(streetActive-1, 0); }
  if(e.key==="Enter" && streetActive>=0){ e.preventDefault(); selectStreet(streetActive); return; }

  [...$("streetDropdown").children].forEach((el,idx)=>el.classList.toggle("active", idx===streetActive));
});

/* ===== HOUSE autocomplete ===== */
$("house").addEventListener("focus", () => {
  triggerHouseSearch(); // even if empty
});

$("house").addEventListener("input", () => {
  $("houseId").value = "";
  triggerHouseSearch();
});

function triggerHouseSearch(){
  const sid = getSelectedStreetId();
  const q = $("house").value.trim();

  if(!sid){
    hideHouseDropdown();
    setHouseHint(true);
    return;
  }
  setHouseHint(false);

  clearTimeout(houseTimer);
  houseTimer = setTimeout(() => loadHouses(sid, q), 200);
}

async function loadHouses(streetId, q){
  try{
    const resp = await fetch(`${PROXY_BASE}/api/houses?streetId=${encodeURIComponent(streetId)}&q=${encodeURIComponent(q)}`, { cache:"no-store" });
    const list = await resp.json();
    houseItems = Array.isArray(list) ? list : [];
    renderHouseDropdown();
  }catch{
    hideHouseDropdown();
  }
}

function renderHouseDropdown(){
  const dd = $("houseDropdown");
  dd.innerHTML = "";
  houseActive = -1;

  if(!houseItems.length){
    hideHouseDropdown();
    return;
  }

  houseItems.forEach((h,i)=>{
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = h.name;
    div.onclick = () => selectHouse(i);
    dd.appendChild(div);
  });
  dd.hidden = false;
}

function selectHouse(i){
  const h = houseItems[i];
  $("house").value = h.name;
  $("houseId").value = h.id || "";
  hideHouseDropdown();
}

$("house").addEventListener("keydown", (e)=>{
  if ($("houseDropdown").hidden) return;

  if(e.key==="ArrowDown"){ e.preventDefault(); houseActive = Math.min(houseActive+1, houseItems.length-1); }
  if(e.key==="ArrowUp"){ e.preventDefault(); houseActive = Math.max(houseActive-1, 0); }
  if(e.key==="Enter" && houseActive>=0){ e.preventDefault(); selectHouse(houseActive); return; }

  [...$("houseDropdown").children].forEach((el,idx)=>el.classList.toggle("active", idx===houseActive));
});

/* ===== close dropdowns on outside click ===== */
document.addEventListener("click", (e)=>{
  if (!e.target.closest("#streetWrap")) hideStreetDropdown();
  if (!e.target.closest("#houseWrap")) hideHouseDropdown();
});

/* ===== submit ===== */
async function onClick(){
  const street = $("street").value.trim();
  const house  = $("house").value.trim();

  $("msgOk").style.display = "none";
  $("msgErr").style.display = "none";

  if(!street){ showErr("Заповніть вулицю"); $("street").focus(); return; }
  if(!house){ showErr("Заповніть будинок"); $("house").focus(); return; }

  setLoading(true);
  try{
    const url = `${PROXY_BASE}/api/group?street=${encodeURIComponent(street)}&house=${encodeURIComponent(house)}`;
    const r = await fetch(url, { cache:"no-store" });
    const d = await r.json();

    if(!d.ok) throw new Error(d.message || "Помилка");

    showOk(`✅ Група: ${d.group}${d.subgroup ? "." + d.subgroup : ""}`);
    
  }catch(e){
    showErr(e.message || String(e));
  }finally{
    setLoading(false);
  }
}

$("btn").onclick = onClick;



setHouseHint(true);
</script>
</body>
</html>
