<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ДТЕК — номер групи</title>
  <style>
    body { margin:0; padding:18px; font-family: -apple-system, Segoe UI, Roboto, Arial; background:#f6f7f9; }
    .box { max-width: 560px; margin: 0 auto; }
    .card { background:#fff; border-radius:16px; padding:16px; box-shadow: 0 10px 24px rgba(0,0,0,.08); border:1px solid rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 12px; }
    label { display:block; font-size: 13px; margin: 12px 0 6px; color:#333; }
    input { width:100%; box-sizing:border-box; padding:12px 12px; border-radius:12px; border:1px solid rgba(0,0,0,.18); font-size: 15px; }
    button {
      margin-top: 14px;
      width:100%;
      padding:12px 14px;
      border-radius: 12px;
      border:0;
      cursor:pointer;
      font-size: 15px;
      font-weight: 700;
      background: #2AABEE;
      color: #fff;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; padding:12px; border-radius:12px; display:none; }
    .ok { background: rgba(46, 204, 113, .12); border:1px solid rgba(46, 204, 113, .35); color:#1f7a43; }
    .err { background: rgba(231, 76, 60, .10); border:1px solid rgba(231, 76, 60, .35); color:#8a1f16; }
    .small { font-size: 12px; opacity:.75; margin-top: 10px; }
    code { background: rgba(0,0,0,.05); padding:2px 6px; border-radius: 8px; }
  </style>
</head>

<body>
  <div class="box">
    <div class="card">
      <h1>Отримання номера групи (Київ, ДТЕК)</h1>

      <label for="street">Вулиця (скопіюйте точно з сайту ДТЕК)</label>
      <input id="street" placeholder="Напр.: вул. Чавдар Єлизавети" />

      <label for="house">Будинок</label>
      <input id="house" placeholder="Напр.: 13 або 38/А" />

      <button id="btn">Отримати номер групи</button>

      <div id="msgOk" class="msg ok"></div>
      <div id="msgErr" class="msg err"></div>


    </div>
  </div>

<script>
  const baseUrl = "https://www.dtek-kem.com.ua";
  const refererUrl = baseUrl + "/ua/shutdowns";
  const ajaxUrl = baseUrl + "/ua/ajax";

  const $ = (id) => document.getElementById(id);

  function showOk(text) {
    $("msgOk").textContent = text;
    $("msgOk").style.display = "block";
    $("msgErr").style.display = "none";
  }

  function showErr(text) {
    $("msgErr").textContent = text;
    $("msgErr").style.display = "block";
    $("msgOk").style.display = "none";
  }

  function extractGroup(subTypeReasonValue) {
    // "GPV37.1" -> "37"
    const m = /GPV(\d+)\./.exec(subTypeReasonValue || "");
    return m ? m[1] : null;
  }

  async function getCsrfTokenAndWarmCookies() {
    // Важно: чтобы браузер сохранил cookies, нужен credentials:'include'
    const resp = await fetch(refererUrl, {
      method: "GET",
      credentials: "include",
      headers: {
        "User-Agent": navigator.userAgent
      }
    });

    const html = await resp.text();

    // достаём meta csrf-token
    const m = /name="csrf-token"\s+content="([^"]+)"/i.exec(html);
    if (!m) throw new Error("CSRF meta tag not found");
    return decodeHtml(m[1]);
  }

  function decodeHtml(s) {
    const t = document.createElement("textarea");
    t.innerHTML = s;
    return t.value;
  }

  async function postGetHomeNum(csrfToken, street) {
    const form = new URLSearchParams();
    form.set("method", "getHomeNum");
    form.set("data[0][name]", "street");
    form.set("data[0][value]", street);

    const resp = await fetch(ajaxUrl, {
      method: "POST",
      credentials: "include",
      headers: {
        "Accept": "application/json, text/javascript, */*; q=0.01",
        "X-Requested-With": "XMLHttpRequest",
        "X-CSRF-Token": csrfToken,
        "Origin": baseUrl,
        "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
        "Referer": refererUrl
      },
      body: form.toString()
    });

    const text = await resp.text();
    let json;
    try { json = JSON.parse(text); }
    catch { throw new Error("Не вдалося розпарсити JSON"); }

    return json;
  }

  async function onClick() {
    const street = $("street").value.trim();
    const house = $("house").value.trim();

    $("msgOk").style.display = "none";
    $("msgErr").style.display = "none";

    if (!street) { showErr("Вкажіть вулицю."); return; }
    if (!house) { showErr("Вкажіть будинок."); return; }

    $("btn").disabled = true;
    $("btn").textContent = "Зачекайте...";

    try {
      const csrf = await getCsrfTokenAndWarmCookies();
      const json = await postGetHomeNum(csrf, street);

      // проверка "улица не найдена": чаще всего data пустой объект
      if (!json || !json.data || Object.keys(json.data).length === 0) {
        showErr("Введена некоретна вулиця. Скопійте назву вулиці точно з Сайту ДТЕК");
        return;
      }

      const houseObj = json.data[house];
      if (!houseObj) {
        // улица есть, но дом не найден
        showErr("Будинок не знайдено для цієї вулиці. Перевірте формат (наприклад: 38/А).");
        return;
      }

      const reason = (houseObj.sub_type_reason && houseObj.sub_type_reason[0]) ? houseObj.sub_type_reason[0] : null;
      const group = extractGroup(reason);

      if (!group) {
        showErr("Не вдалося визначити номер групи (немає sub_type_reason у відповіді).");
        return;
      }

      showOk(`✅ Номер групи для "${street}", буд. "${house}": ${group}`);
    } catch (e) {
      // Часто тут будет CORS/blocked
      showErr("Помилка запиту. Якщо бачите CORS/blocked у консолі — потрібен проксі/сервер між браузером і ДТЕК.\nДеталі: " + (e?.message || e));
    } finally {
      $("btn").disabled = false;
      $("btn").textContent = "Отримати номер групи";
    }
  }

  $("btn").addEventListener("click", onClick);
</script>
</body>
</html>
